# Newest first. Product launches and accepted papers; `text` may contain HTML links.
- date: Oct 2026
  new: true
  text: Launched <a href="https://devforum.roblox.com/t/studio-beta-generate-game-characters-with-prompt-to-avatar/4964945">Prompt-to-Avatar</a> in Roblox Studio Beta, generating animatable 3D game characters with expressive dynamic heads from text prompts.
- date: Aug 2026
  new: true
  text: <a href="https://omnifacerig.github.io/">OmniFaceRig</a> is accepted to <strong>SIGGRAPH Asia 2026</strong> (ACM TOG), and its <a href="https://github.com/facebookresearch/omnifacerig">dataset</a> of 1,345 rigged 3D faces is released.
- date: Jun 2025
  text: <a href="https://zeyuan-chen.com/X-Dancer/">X-Dancer</a> is accepted to <strong>ICCV 2025</strong> as a Highlight.
- date: Jun 2025
  text: Released <a href="https://ai.meta.com/research/seamless-interaction/">Seamless Interaction</a>, a family of dyadic audiovisual motion models for interactive avatars, together with a large-scale conversational dataset, at Meta AI (<a href="https://ai.meta.com/blog/seamless-interaction-natural-conversational-dynamics/">blog</a>).
- date: Feb 2025
  text: <a href="https://x-dyna.github.io/">X-Dyna</a> is accepted to <strong>CVPR 2025</strong> as a Highlight.
- date: Sep 2024
  text: Our real-time interactive 2D avatars, embodied AI agents with expressive faces and accurate lip sync, are showcased in the <a href="https://youtu.be/I7JyydkqDeI?t=948">Meta Connect 2024</a> keynote.
- date: Apr 2024
  text: <a href="https://byteaigc.github.io/x-portrait/">X-Portrait</a> is accepted to <strong>SIGGRAPH 2024</strong>.
- date: Jun 2022
  text: Launched <a href="https://newsroom.tiktok.com/en-us/express-yourself-through-tiktok-avatars">TikTok Avatars</a>, real-time face-driven 3D avatars used in 1M+ videos with 50M+ plays.
