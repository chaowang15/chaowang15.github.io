name: HN Monthly Digest
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to generate (YYYY-MM). Leave empty for last full month."
        required: false
        default: ""
  schedule:
    - cron: "0 10 1 * *" # first day of each month, after the prior month is complete
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate monthly digest
        run: |
          MONTH_ARG="${{ github.event.inputs.month }}"
          if [ -n "$MONTH_ARG" ]; then
            python news_scraper/monthly_digest.py "$MONTH_ARG"
          else
            python news_scraper/monthly_digest.py
          fi
          python -c "import sys; sys.path.insert(0, 'news_scraper'); from index_updater import update_hackernews_index; update_hackernews_index()"
      - name: Commit & push
        run: |
          set -euxo pipefail
          git config user.name "hn-news-bot"
          git config user.email "hn-news-bot@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m "Generate HN Monthly Digest"
          git pull --rebase origin main || true
          git push
